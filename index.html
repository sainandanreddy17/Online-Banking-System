<!DOCTYPE html>
<html>
<head>
    <title>Online Banking System</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f5f9;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #174ea6;
            color: white;
            padding: 25px;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        button {
            background-color: #174ea6;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d3575;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            background-color: #174ea6;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Online Banking System</h1>
        <p>Welcome to Secure Online Banking</p>
    </header>

    <div class="container">
        <h2>Account Management</h2>

        <h3>Account Details</h3>

        <p>Account Holder: Sainandan Reddy</p>
        <p>Account Number: 1234567890</p>
        <p>Account Type: Savings</p>

        <h3>Available Balance</h3>
        <h2>₹25,000</h2>

        <button>View Balance</button>
        <button>Update Account</button>
        <button>Transfer Money</button>
    </div>

    <footer>
        <p>© 2026 Online Banking System</p>
    </footer>

</body>
</html>
